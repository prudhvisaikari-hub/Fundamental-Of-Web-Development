<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
</head>
<body   bgcolor=" lightblue">
    <h1>Student Registration Form</h1>
    <form>
        <label for="fname">First Name:</label><br>
        <input type="text" name="fname" required><br>
        <br>
        <label for="mname">Middle Name:</label><br>
        <input type="text" name="mname"><br>
        <br>
        <label for="lname">Last Name:</label><br>
        <input type="text" name="lname" required><br>
        <br>
        <label for="Branch">Coures:</label>
        <select id="branch" name="branch">
            <option value="Select Course">Select Course</option>
            <option value="FWD">FWD</option>
            <option value="DSA">DSA</option>
            <option value="GLB">GLB</option>
            <option value="MAI">MAI</option>
            <option value="CSE">CSE</option>
        </select><br>
        <br>
        <label for="gender">Gender:</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label><br>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br>
        <input type="radio" id="Other" name="gender" value="Other">
        <label for="Other">Other</label><br>
        <br>
        <label for="Student Hobbies">Student Hobbies:</label><br>
        <input type="checkbox" id="Sports1" name="Sports1" value="Cricket">
        <label for="Sports2">Cricket</label><br>
        <input type="checkbox" id="Sports2" name="Sports2" value="Chess">
        <label for="Sports2">Chess</label><br>
        <input type="checkbox" id="Sports3" name="Sports3" value="Football">
        <label for="Sports3">Football</label><br>
        <input type="checkbox" id="Clutural" name="Clutural" value="Dance">
        <label for="Clutural">Dance</label><br>
        <br>
        <label for="Phone">Phone:</label><br>
        <input type="text" value="+91" size="3">
        <input type="text" required>
        <br>
        <br>
        <label for="Address">Address:</label><br>
        <textarea name="address" rows="5" cols="100"></textarea><br>
        <br>
        <label for="Email">Email ID:</label><br>
        <input type="text" name="Email" required><br>
        <br>
        <input type="submit">
    </form>
</body>
